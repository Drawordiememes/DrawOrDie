<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draw or Die</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#111; --paper:#fff; --yellow:#ffd84a; --red:#ff4d3d; --green:#1f9d55; --gray:#6b6b6b; --bg:#fffbea; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Gochi Hand', cursive; font-size:18px; }
  a { color:inherit; }
  .btn { font-family:inherit; font-size:18px; background:var(--ink); color:#fff; border:2px solid var(--ink); border-radius:999px; padding:8px 20px; cursor:pointer; }
  .btn:disabled { opacity:.5; cursor:default; }
  .btn.ghost { background:var(--paper); color:var(--ink); }

  .paidbar { background:var(--ink); color:#fff; display:flex; align-items:center; gap:14px; padding:8px 16px; min-width:0; }
  .paidlabel { font-family:'Space Mono', monospace; font-weight:700; font-size:14px; letter-spacing:1px; display:flex; align-items:center; gap:8px; flex:none; }
  .dot { width:10px; height:10px; border-radius:50%; background:#3ddc84; box-shadow:0 0 0 0 rgba(61,220,132,.7); animation:pulse 2s infinite; }
  @keyframes pulse { 70% { box-shadow:0 0 0 8px rgba(61,220,132,0); } 100% { box-shadow:0 0 0 0 rgba(61,220,132,0); } }
  .paidlist { display:flex; gap:22px; overflow-x:auto; white-space:nowrap; min-width:0; scrollbar-width:none; }
  .paidlist::-webkit-scrollbar { display:none; }
  .paidlist a { text-decoration:none; font-size:16px; border-bottom:1px dotted #aaa; }
  .paidlist a:hover { color:var(--yellow); border-color:var(--yellow); }
  .paidlist .none { color:#bbb; font-size:16px; }
  .paidlist .item { font-size:16px; }
  .verify { flex:none; margin-left:auto; color:#fff; font-size:15px; text-decoration:none; border-bottom:1px dotted #aaa; white-space:nowrap; }
  .verify:hover { color:var(--yellow); border-color:var(--yellow); }
  @media (prefers-reduced-motion: reduce) { .dot { animation:none; } }

  header { max-width:1000px; margin:0 auto; padding:20px 16px 8px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; }
  h1 { font-family:'Space Mono', monospace; font-size:28px; margin:0; letter-spacing:-1px; }
  .walletbox { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .chip { font-family:'Space Mono', monospace; font-size:14px; background:var(--paper); border:2px solid var(--ink); border-radius:999px; padding:6px 12px; }
  .safe { max-width:1000px; margin:0 auto; padding:0 16px; color:var(--gray); font-size:15px; }

  .ca { max-width:1000px; margin:8px auto 0; padding:0 16px; display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .ca code { font-family:'Space Mono', monospace; font-size:13px; background:var(--paper); border:2px solid var(--ink); border-radius:8px; padding:4px 8px; word-break:break-all; }
  .ca small { font-family:'Space Mono', monospace; font-weight:700; }
  .owner { max-width:1000px; margin:8px auto 0; padding:0 16px; display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .owner input { flex:1 1 280px; width:auto; margin:0; font-family:'Space Mono', monospace; font-size:14px; }
  .owner small { font-family:'Space Mono', monospace; font-weight:700; }
  .promo { max-width:1000px; margin:10px auto 0; padding:0 16px; }
  .promo span { display:block; background:var(--paper); border:2px dashed var(--ink); border-radius:10px; padding:8px 12px; font-size:17px; }
  .promo.ended span { border-style:solid; background:#fff1ee; }
  .banner { max-width:1000px; margin:0 auto; padding:12px 16px 16px; display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; }
  .pill { background:var(--yellow); border:2px solid var(--ink); border-radius:999px; padding:4px 14px; font-variant-numeric:tabular-nums; }
  .pill.plain { background:var(--paper); }
  .pill small { font-family:'Space Mono', monospace; font-size:12px; text-transform:uppercase; letter-spacing:.5px; margin-right:6px; }
  .flash { animation:flash .8s; }
  @keyframes flash { 0% { background:#fff; } 100% { background:var(--yellow); } }

  main { max-width:1000px; margin:0 auto; padding:0 16px 60px; display:grid; gap:28px; grid-template-columns: 340px minmax(0,1fr); align-items:start; }
  @media (max-width:760px){ main { grid-template-columns:minmax(0,1fr); } }
  .panel { background:var(--paper); border:2px solid var(--ink); border-radius:14px; box-shadow:8px 8px 0 var(--yellow); padding:14px; }
  .panel h2 { margin:0 0 8px; font-size:22px; }
  canvas { width:100%; aspect-ratio:4/5; border:1px solid #ddd; background:#fff; touch-action:none; display:block; cursor:crosshair; }
  .tools { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; align-items:center; }
  .sw { width:26px; height:26px; border-radius:50%; border:2px solid var(--ink); cursor:pointer; }
  .sw.on { outline:3px solid var(--yellow); }
  input[type=text] { width:100%; font-family:inherit; font-size:18px; border:2px solid var(--ink); border-radius:8px; padding:8px 10px; margin:6px 0 10px; }
  input[type=range] { width:90px; }
  .grid { display:grid; gap:28px 24px; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); }
  .card { position:relative; background:var(--paper); border:2px solid var(--ink); border-radius:14px; box-shadow:8px 8px 0 var(--yellow); padding:14px; min-width:0; }
  .card .img { border:1px solid #ddd; aspect-ratio:4/5; overflow:hidden; background:#fff; }
  .card .img img { width:100%; height:100%; object-fit:contain; display:block; }
  .card .row { display:flex; justify-content:space-between; align-items:center; margin-top:10px; gap:8px; }
  .name { font-family:'Space Mono', monospace; font-weight:700; font-size:18px; word-break:break-word; }
  .rank { color:var(--red); font-size:20px; }
  .addr { font-family:'Space Mono', monospace; font-size:13px; color:var(--gray); margin:4px 0 10px; }
  .addr a { text-decoration:none; border-bottom:1px dotted var(--gray); }
  .counted { color:var(--green); font-size:16px; height:22px; }
  .hint { color:var(--gray); font-size:16px; }
  .hist { margin-top:30px; }
  .hist h2 { font-size:22px; margin:0 0 6px; }
  .hist ul { padding-left:20px; margin:0; }
  .hist li { margin:6px 0; }
  .st-paid { color:var(--green); }
  .st-wait { color:#b36b00; }
  .st-fail { color:var(--red); }
  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:999px; opacity:0; transition:opacity .2s; pointer-events:none; max-width:90vw; text-align:center; }
  #toast.on { opacity:1; }
</style>
</head>
<body>
<div class="paidbar"><span class="paidlabel"><i class="dot"></i>PAID</span><div class="paidlist" id="paidlist"><span class="none">Loading payouts…</span></div><a class="verify" id="verify" target="_blank" rel="noopener noreferrer" hidden>Verify on Solscan ↗</a></div>

<header>
  <h1 id="title">DRAW OR DIE</h1>
  <div class="walletbox" id="walletbox">
    <button class="btn" id="connect">Connect wallet</button>
    <span class="chip" id="chip" hidden></span>
    <button class="btn ghost" id="disconnect" hidden>Disconnect</button>
  </div>
</header>
<div class="safe">Connecting only asks you to sign a message to prove the wallet is yours. It can't move funds. You can browse without connecting.</div>
<div class="ca" id="ca" hidden><small>CA</small><code id="caText"></code><button class="btn ghost" id="caCopy" style="padding:2px 12px">Copy</button></div>
<div class="owner" id="owner" hidden><small>OWNER</small><input type="text" id="caInput" placeholder="Paste the contract address (CA)" maxlength="64"><button class="btn" id="caSave" style="padding:4px 14px">Save CA</button><button class="btn ghost" id="caClear" style="padding:4px 14px">Clear</button></div>
<div class="promo" id="promo"><span></span></div>
<div class="banner">
  <span class="pill plain" id="timer"><small>round</small>--:--</span>
  <span class="pill" id="feesPill"><small>fees this round</small><span id="fees">0.0000 SOL</span></span>
  <span class="pill" id="prizePill"><small>prize</small><span id="prize">0.0000 SOL</span></span>
  <span class="pill plain"><small>paid out</small><span id="paidTotal">0.0000 SOL</span></span>
  <span class="hint" id="rules"></span>
</div>

<main>
  <section class="panel" id="drawPanel">
    <h2>Draw something</h2>
    <canvas id="cv" width="400" height="500"></canvas>
    <div class="tools">
      <span class="sw on" data-c="#111111" style="background:#111"></span>
      <span class="sw" data-c="#ff4d3d" style="background:#ff4d3d"></span>
      <span class="sw" data-c="#1f9d55" style="background:#1f9d55"></span>
      <span class="sw" data-c="#2f6bff" style="background:#2f6bff"></span>
      <span class="sw" data-c="#ffffff" style="background:#fff" title="Eraser"></span>
      <input type="range" id="size" min="2" max="40" value="6">
      <button class="btn ghost" id="undo" style="padding:2px 12px">Undo</button>
      <button class="btn ghost" id="clear" style="padding:2px 12px">Clear</button>
    </div>
    <input type="text" id="dname" maxlength="24" placeholder="Name your masterpiece">
    <button class="btn" id="submit" style="width:100%">Submit drawing</button>
    <div class="hint" id="drawMsg" style="margin-top:8px"></div>
  </section>

  <section>
    <div class="grid" id="grid"></div>
    <div class="hist" id="hist"></div>
  </section>
</main>
<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let token = null;
try { token = localStorage.getItem('dc_token'); } catch {}
let state = null;

function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 2800); }
const short = (w) => w.slice(0, 4) + '…' + w.slice(-4);
const sol = (l, n = 4) => (l / 1e9).toFixed(n);
const ago = (t) => { const s = Math.max(0, Math.floor((Date.now() - t) / 1000)); return s < 60 ? s + 's ago' : s < 3600 ? Math.floor(s / 60) + 'm ago' : Math.floor(s / 3600) + 'h ago'; };
const solscanTx = (sig) => 'https://solscan.io/tx/' + sig;
const solscanAcct = (w) => 'https://solscan.io/account/' + w;
function link(href, text) { const a = document.createElement('a'); a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.textContent = text; return a; }
function setToken(t) { token = t; try { t ? localStorage.setItem('dc_token', t) : localStorage.removeItem('dc_token'); } catch {} }

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { 'content-type': 'application/json', ...(token ? { authorization: 'Bearer ' + token } : {}), ...(opts.headers || {}) } });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Request failed');
  return j;
}

/* ---------- wallet ---------- */
function provider() { return (window.phantom && window.phantom.solana) || window.solana || window.solflare; }
async function connect() {
  const p = provider();
  if (!p) return toast('No Solana wallet found. Install Phantom, then refresh.');
  try {
    const { publicKey } = await p.connect();
    const wallet = publicKey.toString();
    const { nonce, message } = await api('/api/nonce');
    const signed = await p.signMessage(new TextEncoder().encode(message), 'utf8');
    const sig = signed.signature || signed;
    let bin = ''; new Uint8Array(sig).forEach((b) => (bin += String.fromCharCode(b)));
    const r = await api('/api/login', { method: 'POST', body: JSON.stringify({ wallet, nonce, signature: btoa(bin) }) });
    setToken(r.token);
    toast('Connected ' + short(wallet));
    await refresh();
  } catch (e) { toast(e.message || 'Connect cancelled'); }
}
async function disconnect() {
  try { await api('/api/logout', { method: 'POST' }); } catch {}
  try { const p = provider(); if (p && p.disconnect) await p.disconnect(); } catch {}
  setToken(null);
  toast('Disconnected');
  await refresh();
}
$('connect').onclick = connect;
async function saveCa(value) {
  try { await api('/api/owner/ca', { method: 'POST', body: JSON.stringify({ ca: value }) }); toast(value ? 'CA saved' : 'CA cleared'); if (!value) $('caInput').value = ''; await refresh(); } catch (e) { toast(e.message); }
}
$('caSave').onclick = () => saveCa($('caInput').value.trim());
$('caClear').onclick = () => saveCa('');
$('caCopy').onclick = async () => { try { await navigator.clipboard.writeText(state.ca); toast('CA copied'); } catch { toast('Select the address and copy it'); } };
$('disconnect').onclick = disconnect;

/* ---------- state / render ---------- */
let skew = 0, lastFees = null, lastPrize = null, lastRound = null;
async function refresh() {
  try { state = await api('/api/state'); } catch { return; }
  skew = state.now - Date.now();
  if (lastRound !== null && state.round.id !== lastRound) toast('New round! The board has been cleared.');
  lastRound = state.round.id;
  if (token && !state.me) setToken(null);
  render();
}
function flash(el) { el.parentElement.classList.remove('flash'); void el.parentElement.offsetWidth; el.parentElement.classList.add('flash'); }
function render() {
  $('title').textContent = state.siteName;
  document.title = state.siteName;

  const me = state.me;
  $('connect').hidden = !!me;
  $('chip').hidden = !me; $('disconnect').hidden = !me;
  if (me) $('chip').textContent = short(me.wallet);

  // fees + prize (update live)
  const f = state.fees;
  $('fees').textContent = f.live ? sol(f.round) + ' SOL' : 'not set up';
  $('prize').textContent = f.live ? sol(f.prize) + ' SOL' : '--';
  $('prize').parentElement.firstElementChild.textContent = `prize (${Math.round(state.feeShare * 100)}%)`;
  if (lastFees !== null && f.round > lastFees) flash($('fees'));
  if (lastPrize !== null && f.prize > lastPrize) flash($('prize'));
  lastFees = f.round; lastPrize = f.prize;
  $('paidTotal').textContent = sol(state.paidTotal) + ' SOL';

  $('owner').hidden = !(me && me.isOwner);
  $('ca').hidden = !state.ca; if (state.ca) $('caText').textContent = state.ca;
  // prize promo status: always say plainly how many paid rounds are left
  const pr = state.promo || { limit: 0 };
  const promoEl = $('promo');
  promoEl.hidden = !pr.limit;
  promoEl.classList.toggle('ended', !!pr.ended);
  if (pr.limit) {
    promoEl.firstElementChild.textContent = pr.ended
      ? `Prize promo is over: all ${pr.limit} paid rounds have been paid (see the PAID bar). The contest keeps running for fun, but there are no more prizes.`
      : `Prize promo: ${pr.used} of ${pr.limit} paid rounds used. Winners of the first ${pr.limit} rounds get ${Math.round(state.feeShare * 100)}% of that round's fees. After that, prizes stop.`;
    $('feesPill').hidden = !!pr.ended;
    if (pr.ended) $('prize').textContent = 'none';
  }
  $('rules').textContent = 'No token needed. 1 drawing + 1 vote per wallet per round. Prizes depend on fees actually collected.';

  // paid bar
  const pl = $('paidlist'); pl.innerHTML = '';
  if (!state.payouts.length) { const s = document.createElement('span'); s.className = 'none'; s.textContent = 'No payouts yet. Winners appear here with a Solscan link.'; pl.appendChild(s); }
  state.payouts.forEach((p) => { const s = document.createElement('span'); s.className = 'item'; s.textContent = `${sol(p.lamports)} SOL → ${short(p.wallet)}${p.name ? ' · "' + p.name + '"' : ''} · ${ago(p.at)}`; pl.appendChild(s); });
  const vf = $('verify'); vf.hidden = !state.fees.wallet; if (state.fees.wallet) vf.href = solscanAcct(state.fees.wallet);

  $('submit').disabled = !me || me.myDrawing;
  $('drawMsg').textContent = !me ? 'Connect your wallet to submit.' : me.myDrawing ? 'You already submitted this round.' : '';

  const grid = $('grid'); grid.innerHTML = '';
  if (!state.drawings.length) { const p = document.createElement('div'); p.className = 'hint'; p.textContent = 'No drawings yet this round. Be the first.'; grid.appendChild(p); }
  state.drawings.forEach((x, i) => {
    const card = document.createElement('div'); card.className = 'card';
    const voted = me && me.myVote === x.id;
    const counted = document.createElement('div'); counted.className = 'counted'; counted.textContent = voted ? 'Vote counted ✓' : '';
    const img = document.createElement('div'); img.className = 'img';
    const im = document.createElement('img'); im.src = x.img; im.alt = x.name; img.appendChild(im);
    const r1 = document.createElement('div'); r1.className = 'row';
    const nm = document.createElement('div'); nm.className = 'name'; nm.textContent = x.name;
    const rk = document.createElement('div'); rk.className = 'rank'; rk.textContent = '#' + (i + 1);
    r1.append(nm, rk);
    const ad = document.createElement('div'); ad.className = 'addr'; ad.appendChild(link(solscanAcct(x.wallet), short(x.wallet)));
    const r2 = document.createElement('div'); r2.className = 'row'; r2.style.marginTop = '0';
    const vc = document.createElement('div'); vc.textContent = `${x.votes} vote${x.votes === 1 ? '' : 's'}`;
    const b = document.createElement('button'); b.className = 'btn';
    b.textContent = voted ? 'Voted ✓' : me ? 'Vote' : 'Connect to vote';
    b.disabled = !!(me && me.myVote);
    b.onclick = async () => {
      if (!state.me) return connect();
      try { await api('/api/vote', { method: 'POST', body: JSON.stringify({ drawingId: x.id }) }); await refresh(); } catch (e) { toast(e.message); }
    };
    r2.append(vc, b);
    card.append(counted, img, r1, ad, r2);
    grid.appendChild(card);
  });

  const h = $('hist'); h.innerHTML = '';
  if (state.history.length) {
    const t = document.createElement('h2'); t.textContent = 'Past rounds'; h.appendChild(t);
    const ul = document.createElement('ul');
    state.history.forEach((r) => {
      const li = document.createElement('li');
      if (!r.winner) { li.textContent = `Round ${r.id}: no entries`; ul.appendChild(li); return; }
      li.append(`Round ${r.id}: "${r.winner.name}" by ${short(r.winner.wallet)} (${r.winner.votes} vote${r.winner.votes === 1 ? '' : 's'}) · `);
      const s = document.createElement('span');
      if (r.payState === 'paid') { s.className = 'st-paid'; s.appendChild(link(solscanTx(r.tx), `paid ${sol(r.prize)} SOL ✓ Solscan ↗`)); }
      else if (r.payState === 'none') { s.className = 'hint'; s.textContent = 'no fees to pay'; }
      else if (r.payState === 'failed') { s.className = 'st-fail'; s.textContent = 'payout failed, owner is checking'; }
      else { s.className = 'st-wait'; s.textContent = `${sol(r.prize)} SOL awaiting payout`; }
      li.appendChild(s); ul.appendChild(li);
    });
    h.appendChild(ul);
  }
}

let refreshing = false;
setInterval(() => {
  if (!state) return;
  const left = Math.max(0, state.round.end - (Date.now() + skew));
  const s = Math.ceil(left / 1000);
  $('timer').lastChild.textContent = `Round ${state.round.id} · ends in ${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  if (left === 0 && !refreshing) { refreshing = true; refresh().finally(() => setTimeout(() => (refreshing = false), 1500)); }
}, 250);
setInterval(refresh, 5000);

/* ---------- canvas ---------- */
const cv = $('cv'), ctx = cv.getContext('2d');
let color = '#111111', drawing = false, last = null, snapshots = [];
function blank() { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); }
blank();
ctx.lineCap = 'round'; ctx.lineJoin = 'round';
function pos(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height }; }
cv.addEventListener('pointerdown', (e) => {
  cv.setPointerCapture(e.pointerId);
  snapshots.push(ctx.getImageData(0, 0, cv.width, cv.height)); if (snapshots.length > 30) snapshots.shift();
  drawing = true; last = pos(e);
  ctx.strokeStyle = color; ctx.lineWidth = +$('size').value;
  ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(last.x + 0.01, last.y); ctx.stroke();
});
cv.addEventListener('pointermove', (e) => {
  if (!drawing) return;
  const p = pos(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p;
});
['pointerup', 'pointercancel'].forEach((ev) => cv.addEventListener(ev, () => { drawing = false; }));
document.querySelectorAll('.sw').forEach((s) => s.onclick = () => { document.querySelectorAll('.sw').forEach((o) => o.classList.remove('on')); s.classList.add('on'); color = s.dataset.c; });
$('undo').onclick = () => { const s = snapshots.pop(); if (s) ctx.putImageData(s, 0, 0); };
$('clear').onclick = () => { snapshots.push(ctx.getImageData(0, 0, cv.width, cv.height)); blank(); };
$('submit').onclick = async () => {
  const name = $('dname').value.trim();
  if (!name) return toast('Name it first');
  $('submit').disabled = true;
  try {
    await api('/api/drawings', { method: 'POST', body: JSON.stringify({ name, image: cv.toDataURL('image/png') }) });
    toast('Submitted!'); $('dname').value = ''; blank(); snapshots = [];
  } catch (e) { toast(e.message); }
  await refresh();
};

refresh();
</script>
</body>
</html>
