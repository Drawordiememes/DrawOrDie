<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hourly Wire</title>
<meta name="description" content="Animals, rescues, funny stories and space news, refreshed every hour.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐾%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f7f4; --panel: #ffffff; --panel2: #eef1ea; --line: #dfe3d8;
    --text: #1b2218; --muted: #5d6857; --accent: #1f7a45; --accent-ink: #ffffff;
    --new: #d9480f; --warn: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101410; --panel: #171d17; --panel2: #1e261e; --line: #2b352b;
      --text: #e8efe4; --muted: #92a08c; --accent: #5fd08a; --accent-ink: #0a2315;
      --new: #ff9a62; --warn: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: inherit; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
  header { padding: 22px 0 6px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: -.02em; }
  .tagline { color: var(--muted); font-size: 14px; }
  #updated { margin-left: auto; color: var(--muted); font-size: 13px; }
  .banner { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin: 10px 0; font-size: 14px; }
  .banner.warn { border-color: var(--warn); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-right: 2px; }
  button, select, input[type=search] { font: inherit; font-size: 14px; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 13px; cursor: pointer; }
  input[type=search] { border-radius: 8px; cursor: text; min-width: 170px; }
  select { border-radius: 8px; }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button .n { opacity: .7; font-size: 12px; margin-left: 4px; font-variant-numeric: tabular-nums; }
  button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tabs button { border-radius: 8px; padding: 8px 14px; }
  label.check { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; color: var(--muted); cursor: pointer; }
  .spacer { flex: 1; }
  #buzz button { padding: 4px 11px; }
  #list { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); margin: 12px 0 28px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
  .card .pic { width: 100%; height: 160px; object-fit: cover; background: var(--panel2); display: block; }
  .card .body { padding: 13px 14px 14px; display: flex; flex-direction: column; gap: 7px; }
  .meta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
  .new { background: var(--new); color: #fff; font-weight: 700; font-size: 10px; letter-spacing: .06em; padding: 1px 7px; border-radius: 999px; }
  h3 { margin: 0; font-size: 16px; line-height: 1.3; letter-spacing: -.005em; }
  h3 a { text-decoration: none; }
  h3 a:hover { text-decoration: underline; }
  .sum { margin: 0; font-size: 13.5px; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 11.5px; padding: 2px 9px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); color: var(--muted); }
  .chip.name { cursor: pointer; color: var(--text); font-weight: 600; }
  .chip.upset { color: var(--warn); border-color: var(--warn); }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 50px 10px; }
  details.src { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
  details.src summary { cursor: pointer; }
  details.src ul { margin: 8px 0 0; padding-left: 18px; }
  footer { color: var(--muted); font-size: 12.5px; padding: 0 0 36px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🐾 Hourly Wire</h1>
    <span class="tagline">animals, rescues, funny stories and space, refreshed every hour</span>
    <span id="updated" aria-live="polite"></span>
  </header>

  <div id="banners"></div>

  <div class="row tabs" id="tabs" role="tablist" aria-label="Section"></div>
  <div class="row" id="windows" aria-label="Time window"></div>
  <div class="row" id="buzzrow" hidden><span class="label">Animals in the news</span><span id="buzz" class="row" style="margin:0"></span></div>
  <div class="row">
    <input type="search" id="q" placeholder="Search stories" aria-label="Search stories">
    <select id="sort" aria-label="Sort">
      <option value="new">Newest first</option>
      <option value="buzz">Most outlets first</option>
    </select>
    <label class="check"><input type="checkbox" id="hideUpset" checked> Hide upsetting stories</label>
    <label class="check"><input type="checkbox" id="onlyNew"> New since last update</label>
  </div>

  <main id="list"></main>

  <details class="src" id="sources"></details>
  <footer>Headlines link to the original publishers. Times come from each feed and can be approximate. The site rebuilds about once an hour, and GitHub can run a little late.</footer>
</div>

<script>
const $ = (s) => document.querySelector(s);
const WINDOWS = [[1, 'Past hour'], [3, '3 hours'], [6, '6 hours'], [24, '24 hours'], [48, '48 hours']];
const TABS = [['animals', 'Animals'], ['rescue', 'Rescues & saving'], ['funny', 'Funny'], ['space', 'Space'], ['goodnews', 'Good news'], ['all', 'Everything']];
const st = { data: null, tab: 'animals', win: 1, species: '', autoWidened: false, firstRender: true };

function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'href') { if (/^https?:\/\//i.test(v)) { e.href = v; e.target = '_blank'; e.rel = 'noopener noreferrer'; } }
    else e.setAttribute(k, v);
  }
  for (const k of kids) if (k != null) e.append(k);
  return e;
}

function ago(ms) {
  const m = Math.max(0, Math.round((Date.now() - ms) / 60000));
  if (m < 1) return 'just now';
  if (m < 60) return m + ' min ago';
  const h = Math.round(m / 60);
  return h < 48 ? h + ' h ago' : Math.round(h / 24) + ' d ago';
}

function opts() {
  return { q: $('#q').value.trim().toLowerCase(), hideUpset: $('#hideUpset').checked, onlyNew: $('#onlyNew').checked };
}

function base(items, o) {
  return items.filter((i) =>
    (!o.hideUpset || !i.upset) &&
    (!o.onlyNew || i.isNew) &&
    (!o.q || i.title.toLowerCase().includes(o.q) || (i.summary || '').toLowerCase().includes(o.q) || i.sources.some((s) => s.toLowerCase().includes(o.q))));
}
const inTab = (i, tab) => tab === 'all' || i.tags.includes(tab);
const inWin = (i, h) => Date.now() - Date.parse(i.published) <= h * 3600e3;

function render() {
  const d = st.data;
  if (!d) return;
  const o = opts();
  const all = base(d.items, o);

  // First load: if the past hour is empty for this section, widen to the first window that has something.
  if (st.firstRender) {
    st.firstRender = false;
    for (const [h] of WINDOWS) {
      if (all.some((i) => inTab(i, st.tab) && inWin(i, h))) { st.autoWidened = h !== 1; st.win = h; break; }
    }
  }

  // tabs
  const tabs = $('#tabs'); tabs.replaceChildren();
  for (const [id, label] of TABS) {
    const n = all.filter((i) => inTab(i, id) && inWin(i, st.win)).length;
    const b = el('button', { class: id === st.tab ? 'on' : '', role: 'tab', 'aria-selected': String(id === st.tab) }, label, el('span', { class: 'n', text: String(n) }));
    b.onclick = () => { st.tab = id; st.species = ''; st.autoWidened = false; render(); };
    tabs.append(b);
  }

  // windows
  const wins = $('#windows'); wins.replaceChildren(el('span', { class: 'label', text: 'Show' }));
  for (const [h, label] of WINDOWS) {
    const n = all.filter((i) => inTab(i, st.tab) && inWin(i, h)).length;
    const b = el('button', { class: h === st.win ? 'on' : '' }, label, el('span', { class: 'n', text: String(n) }));
    b.onclick = () => { st.win = h; st.autoWidened = false; render(); };
    wins.append(b);
  }

  // species buzz (animals in the current time window)
  const counts = new Map();
  for (const i of all) if (i.tags.includes('animals') && inWin(i, st.win)) for (const s of new Set(i.species)) counts.set(s, (counts.get(s) || 0) + 1);
  const top = [...counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 14);
  $('#buzzrow').hidden = !top.length;
  const buzz = $('#buzz'); buzz.replaceChildren();
  for (const [k, n] of top) {
    const b = el('button', { class: k === st.species ? 'on' : '', title: `${n} stor${n === 1 ? 'y' : 'ies'}` }, `${(d.speciesMeta || {})[k] || '🐾'} ${k}`, el('span', { class: 'n', text: String(n) }));
    b.onclick = () => { st.species = st.species === k ? '' : k; render(); };
    buzz.append(b);
  }

  // list
  let list = all.filter((i) => inTab(i, st.tab) && inWin(i, st.win) && (!st.species || i.species.includes(st.species)));
  list.sort($('#sort').value === 'buzz'
    ? (a, b) => b.sources.length - a.sources.length || Date.parse(b.published) - Date.parse(a.published)
    : (a, b) => Date.parse(b.published) - Date.parse(a.published));

  const grid = $('#list'); grid.replaceChildren();
  if (!list.length) {
    const next = WINDOWS.find(([h]) => h > st.win && all.some((i) => inTab(i, st.tab) && inWin(i, h)));
    const msg = el('div', { class: 'empty' }, `Nothing here for ${WINDOWS.find(([h]) => h === st.win)[1].toLowerCase()}. `);
    if (next) { const b = el('button', { text: 'Show ' + next[1].toLowerCase() }); b.onclick = () => { st.win = next[0]; render(); }; msg.append(b); }
    grid.append(msg);
  }
  for (const i of list) grid.append(card(i));

  // banners
  const ban = $('#banners'); ban.replaceChildren();
  if (d.demo) ban.append(el('div', { class: 'banner warn', text: 'This is sample data. The first real hourly update has not run yet. See the README to switch it on.' }));
  else {
    const age = (Date.now() - Date.parse(d.generatedAt)) / 3600e3;
    if (age > 4) ban.append(el('div', { class: 'banner warn', text: `The last update was ${Math.round(age)} hours ago. Check the Actions tab on GitHub: the hourly job may have stopped.` }));
  }
  if (st.autoWidened) ban.append(el('div', { class: 'banner', text: 'Nothing new in the past hour for this section, so this shows a wider window.' }));

  // sources
  const sd = $('#sources'); sd.replaceChildren();
  const failed = d.sources.filter((s) => !s.ok && !s.optional);
  const okN = d.sources.filter((s) => s.ok).length;
  sd.append(el('summary', { text: `${okN} of ${d.sources.length} sources responded${failed.length ? ' · ' + failed.length + ' failed' : ''}` }));
  const ul = el('ul');
  for (const s of d.sources) ul.append(el('li', { text: `${s.ok ? '✓' : '✗'} ${s.name}${s.ok ? ' (' + s.count + ')' : ' — ' + s.error}` }));
  sd.append(ul);

  $('#updated').textContent = d.generatedAt ? 'Updated ' + ago(Date.parse(d.generatedAt)) : '';
}

function card(i) {
  const c = el('article', { class: 'card' });
  if (i.image && /^https:\/\//i.test(i.image)) {
    const img = el('img', { class: 'pic', alt: '', loading: 'lazy', referrerpolicy: 'no-referrer', src: i.image });
    img.onerror = () => img.remove();
    c.append(img);
  }
  const meta = el('div', { class: 'meta' });
  if (i.isNew) meta.append(el('span', { class: 'new', text: 'NEW' }));
  const when = new Date(i.published);
  meta.append(el('span', { text: ago(when.getTime()) + (i.approxTime ? ' (approx.)' : ''), title: when.toLocaleString() }));
  meta.append(el('span', { text: '· ' + i.source }));
  if (i.sources.length > 1) meta.append(el('span', { text: `· +${i.sources.length - 1} more outlet${i.sources.length > 2 ? 's' : ''}`, title: i.sources.join(', ') }));

  const body = el('div', { class: 'body' }, meta, el('h3', {}, el('a', { href: i.link, text: i.title })));
  if (i.summary) body.append(el('p', { class: 'sum', text: i.summary }));

  const chips = el('div', { class: 'chips' });
  const meta2 = st.data.speciesMeta || {};
  for (const s of i.species.slice(0, 3)) chips.append(el('span', { class: 'chip', text: `${meta2[s] || '🐾'} ${s}` }));
  for (const n of i.names || []) {
    const b = el('span', { class: 'chip name', title: 'Click to copy this name', text: '“' + n + '”', role: 'button', tabindex: '0' });
    const copy = async () => { try { await navigator.clipboard.writeText(n); const t = b.textContent; b.textContent = 'copied'; setTimeout(() => (b.textContent = t), 900); } catch {} };
    b.onclick = copy; b.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); copy(); } };
    chips.append(b);
  }
  for (const t of i.tags) if (t !== 'animals' && t !== st.tab) chips.append(el('span', { class: 'chip', text: ({ rescue: 'rescue', funny: 'funny', space: 'space', goodnews: 'good news' })[t] || t }));
  if (i.upset) chips.append(el('span', { class: 'chip upset', text: 'upsetting' }));
  if (chips.childNodes.length) body.append(chips);
  c.append(body);
  return c;
}

async function load() {
  try {
    const r = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if (!st.data || d.generatedAt !== st.data.generatedAt) { st.data = d; render(); }
    else $('#updated').textContent = 'Updated ' + ago(Date.parse(d.generatedAt));
  } catch (e) {
    if (!st.data) {
      $('#list').replaceChildren(el('div', { class: 'empty', text: 'Could not load data.json (' + e.message + '). If you opened this file straight from your computer, use "npm run serve" instead, or wait for the first hourly update on GitHub.' }));
    }
  }
}

$('#q').oninput = render;
$('#sort').onchange = render;
$('#hideUpset').onchange = render;
$('#onlyNew').onchange = render;
load();
setInterval(load, 5 * 60 * 1000);
setInterval(() => { if (st.data) { $('#updated').textContent = 'Updated ' + ago(Date.parse(st.data.generatedAt)); } }, 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
</body>
</html>
